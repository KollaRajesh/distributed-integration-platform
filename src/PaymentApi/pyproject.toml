[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-api"
version = "0.1.0"
description = "Payment API service for contract-driven billing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
